<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Redirect all 404 SPA routes back to index.html, preserving path + query.
        // Works for both root deployments (/) and sub-path deployments (/BankingFinanceWebApp/).
        (function () {
            var l = window.location;

            // Determine the base path: everything up to (but not including) the first segment
            // that is NOT the repo/sub-path name. For GitHub Pages project sites the pathname
            // starts with /<repoName>/; we keep that as the base and treat the rest as the SPA route.
            // Strategy: find the deepest path segment that corresponds to an index.html by
            // walking up until we are at the root. Simpler and more portable: use the segment
            // count of the canonical base path (1 for root deploy, 2 for project-page deploy).
            var pathSegments = l.pathname.split('/').filter(Boolean); // remove empty strings
            // If deployed at root ("kapambwe.github.io/"), base = "/", route = full path.
            // If deployed at sub-path ("kapambwe.github.io/BankingFinanceWebApp/"),
            // base = "/BankingFinanceWebApp", route = rest.
            // Detect: if the repo is NOT a user/org page, the first segment is the repo name.
            var isProjectPage = (l.hostname.split('.').length === 3); // e.g. user.github.io
            var basePath = isProjectPage && pathSegments.length > 0
                ? '/' + pathSegments[0]
                : '';

            // The SPA route is everything after the base path
            var route = l.pathname.replace(new RegExp('^' + basePath), '') || '/';
            if (route === '/' || route === '/index.html') return;

            // Build query: path= encodes the SPA route, then append original query params
            var existing = l.search.length > 1 ? l.search.slice(1) : '';
            var newQuery = 'path=' + encodeURIComponent(route) + (existing ? '&' + existing : '');

            l.replace(basePath + '/?' + newQuery + l.hash);
        })();
    </script>
</head>
<body>
</body>
</html>
